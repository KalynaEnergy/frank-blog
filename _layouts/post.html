---
layout: base
---
<article class="post">
  <h1 class="post-title">{{ page.title | escape }}</h1>
  <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
  <div class="post-content">
    {{ content }}
  </div>
</article>
<p class="backlink"><a href="{{ '/' | relative_url }}">← all posts</a></p>
